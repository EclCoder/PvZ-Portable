name: Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Delete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
          "/repos/${{ github.repository }}/commits/b4f1ba0" \
          --jq '.sha'