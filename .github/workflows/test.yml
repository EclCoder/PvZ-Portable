name: Delete branches

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Delete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE \
            "/repos/${{ github.repository }}/git/refs/heads/32-bit-test"

          gh api --method DELETE \
            "/repos/${{ github.repository }}/git/refs/heads/1437"

          gh api --method DELETE \
            "/repos/${{ github.repository }}/git/refs/heads/buttons"

          gh api --method DELETE \
            "/repos/${{ github.repository }}/git/refs/heads/clamp-to-std-clamp"