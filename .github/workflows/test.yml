name: Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
          --method POST \
          "/repos/${{ github.repository }}/git/refs" \
          -f ref="refs/heads/release-0.2.1" \
          -f sha="b4f1ba08ab9eed8788bbb3f0d5f75c75d9c06fa6"