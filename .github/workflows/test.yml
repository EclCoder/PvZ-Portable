name: Delete branches

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Delete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE \
            "/repos/${{ github.repository }}/git/refs/heads/fix/fix-update-counter-signedness"

          gh api --method DELETE \
            "/repos/${{ github.repository }}/git/refs/heads/refactor-string_view"

          gh api --method DELETE \
            "/repos/${{ github.repository }}/git/refs/heads/touch-system"

          gh api --method DELETE \
            "/repos/${{ github.repository }}/git/refs/heads/unicode-input"